name: v0.7 EEGMMIDB Multi-Subject Null Replication

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subject-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        subject: [S002, S003, S004, S005, S006, S007, S008, S009, S010, S011]
    env:
      APP_VALIDATION_BASE: 535e3136a36e6754bbd93a8cf36fcd91f02f4de0
      ENGINE_BLOB_SHA1: be472fb4939d723dc4133f3652a8deabee470a04
      SIGNAL_ENGINE_BLOB_SHA1: e6f25721ad18be07666bf38de4921de6ee914a21
      EDF_PARSER_BLOB_SHA1: dfdb7520cb51cfa3e5088dac0ad773fb778719ae
      PYTHON_ORACLE_BLOB_SHA1: 2cd26cf925a8d85970fb9dabaeb3a3c8d4409679
      PREREG_BLOB_SHA1: e8bda40214284bedef8274e0e6420be068d1aedc
      REPLICATION_SCRIPT_BLOB_SHA1: 9d1f55395c84eee8ddcbcd113ad2482435aaf0d1
      REPLICATION_TEST_BLOB_SHA1: 34083cba9f2c68f73d3a93757838049f6e6af87a
      PHYSIONET_BASE: https://physionet.org/files/eegmmidb/1.0.0
      V07_EEGMMIDB_REPLICATION: 'true'
      V07_EEGMMIDB_SUBJECT: ${{ matrix.subject }}
      V07_EEGMMIDB_EDF: ${{ github.workspace }}/build/v07-replication/${{ matrix.subject }}R02.edf
      V07_EEGMMIDB_REFERENCE_DIR: ${{ github.workspace }}/build/v07-replication/${{ matrix.subject }}/reference

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify preregistration and frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/validation/V07_EEGMMIDB_MULTISUBJECT_NULL_PREREG.json)" = "$PREREG_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_eegmmidb_multisubject_null.py)" = "$REPLICATION_SCRIPT_BLOB_SHA1"
          test "$(git hash-object app/src/test/java/de/meegread/app/analysis/CouplingFieldV07EegmmidbReplicationParityTest.kt)" = "$REPLICATION_TEST_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/analysis/CouplingFieldV07Engine.kt)" = "$ENGINE_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/analysis/SignalAnalysisEngine.kt)" = "$SIGNAL_ENGINE_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/data/EdfBdfParser.kt)" = "$EDF_PARSER_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_reference.py)" = "$PYTHON_ORACLE_BLOB_SHA1"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download and checksum exact preregistered baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$V07_EEGMMIDB_REFERENCE_DIR"
          source_path="${{ matrix.subject }}/${{ matrix.subject }}R02.edf"
          curl --fail --location --retry 3 --retry-delay 2 "$PHYSIONET_BASE/SHA256SUMS.txt" -o build/v07-replication/SHA256SUMS.txt
          expected_sha256="$(awk -v p="$source_path" '$2==p {print $1; exit}' build/v07-replication/SHA256SUMS.txt)"
          test "${#expected_sha256}" -eq 64
          curl --fail --location --retry 3 --retry-delay 2 "$PHYSIONET_BASE/$source_path" -o "$V07_EEGMMIDB_EDF"
          actual_sha256="$(sha256sum "$V07_EEGMMIDB_EDF" | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"
          echo "EEGMMIDB_DATASET_SHA256=$actual_sha256" >> "$GITHUB_ENV"

      - name: Generate observed Python reference plus frozen null
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools/validation python tools/validation/v07_eegmmidb_multisubject_null.py subject \
            --input "$V07_EEGMMIDB_EDF" \
            --subject "${{ matrix.subject }}" \
            --expected-sha256 "$EEGMMIDB_DATASET_SHA256" \
            --out-dir "$V07_EEGMMIDB_REFERENCE_DIR" \
            --surrogates 49

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Kotlin vs Python full observed parity
        run: gradle :app:testDebugUnitTest --tests 'de.meegread.app.analysis.CouplingFieldV07EegmmidbReplicationParityTest' --no-daemon --stacktrace

      - name: Upload subject reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v07-eegmmidb-${{ matrix.subject }}-replication
          path: |
            ${{ env.V07_EEGMMIDB_REFERENCE_DIR }}/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  aggregate:
    needs: subject-replication
    runs-on: ubuntu-latest
    if: always() && needs.subject-replication.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download all subject artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: v07-eegmmidb-*-replication
          path: build/v07-replication/subjects
          merge-multiple: false
      - name: Aggregate preregistered group inference
        run: |
          PYTHONPATH=tools/validation python tools/validation/v07_eegmmidb_multisubject_null.py aggregate \
            --root build/v07-replication/subjects \
            --out-dir build/v07-replication/group
      - name: Upload group summary
        uses: actions/upload-artifact@v4
        with:
          name: v07-eegmmidb-multisubject-group
          path: build/v07-replication/group/
