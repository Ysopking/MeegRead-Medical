name: v0.7 RepOD Schizophrenia Clinical Discrimination

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subject-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        subject: [h01, h02, h03, h04, h05, h06, h07, h08, h09, h10, h11, h12, h13, h14, s01, s02, s03, s04, s05, s06, s07, s08, s09, s10, s11, s12, s13, s14]
    env:
      APP_VALIDATION_BASE: d8299e3b773649cbc90c911f8acfb27592ca2690
      ENGINE_BLOB_SHA1: be472fb4939d723dc4133f3652a8deabee470a04
      SIGNAL_ENGINE_BLOB_SHA1: e6f25721ad18be07666bf38de4921de6ee914a21
      EDF_PARSER_BLOB_SHA1: dfdb7520cb51cfa3e5088dac0ad773fb778719ae
      PYTHON_ORACLE_BLOB_SHA1: 2cd26cf925a8d85970fb9dabaeb3a3c8d4409679
      PREREG_BLOB_SHA1: 83a5c6e6e232687c7b37a2c7324711f1d946807c
      DOWNLOAD_SCRIPT_BLOB_SHA1: 74e33ec780da0c21ce8c651033373302e763df87
      CLINICAL_SCRIPT_BLOB_SHA1: bb3edd958686f80bfb0722247c1a1c5e11418cdb
      GROUP_SCRIPT_BLOB_SHA1: 2aa57a940b203dd6dc0eaeb2cd1ec1bd4dd6743a
      PARITY_TEST_BLOB_SHA1: 2611a71a23d934192b5edbcd93e9a361b82ecde6
      V07_REPOD_CLINICAL: 'true'
      V07_REPOD_SUBJECT: ${{ matrix.subject }}
      V07_REPOD_ROOT: ${{ github.workspace }}/build/v07-repod/${{ matrix.subject }}
      V07_REPOD_EDF: ${{ github.workspace }}/build/v07-repod/${{ matrix.subject }}/${{ matrix.subject }}.edf
      V07_REPOD_SOURCE_METADATA: ${{ github.workspace }}/build/v07-repod/${{ matrix.subject }}/source_metadata.json
      V07_REPOD_REFERENCE_DIR: ${{ github.workspace }}/build/v07-repod/${{ matrix.subject }}/reference/parity_window

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify preregistration and frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/validation/V07_REPOD_SCHIZOPHRENIA_CLINICAL_PREREG.json)" = "$PREREG_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_repod_download.py)" = "$DOWNLOAD_SCRIPT_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_repod_clinical.py)" = "$CLINICAL_SCRIPT_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_repod_group.py)" = "$GROUP_SCRIPT_BLOB_SHA1"
          test "$(git hash-object app/src/test/java/de/meegread/app/analysis/CouplingFieldV07RepodClinicalParityTest.kt)" = "$PARITY_TEST_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/analysis/CouplingFieldV07Engine.kt)" = "$ENGINE_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/analysis/SignalAnalysisEngine.kt)" = "$SIGNAL_ENGINE_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/data/EdfBdfParser.kt)" = "$EDF_PARSER_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_reference.py)" = "$PYTHON_ORACLE_BLOB_SHA1"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download exact RepOD v1.0 EDF and verify published MD5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$V07_REPOD_ROOT"
          python tools/validation/v07_repod_download.py \
            --filename "${{ matrix.subject }}.edf" \
            --output "$V07_REPOD_EDF" \
            --metadata-output "$V07_REPOD_SOURCE_METADATA"

      - name: Generate frozen 12-window subject metrics and Python tail reference
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.subject }}" == h* ]]; then group=healthy; else group=schizophrenia; fi
          PYTHONPATH=tools/validation python tools/validation/v07_repod_clinical.py \
            --input "$V07_REPOD_EDF" \
            --subject "${{ matrix.subject }}" \
            --group "$group" \
            --source-metadata "$V07_REPOD_SOURCE_METADATA" \
            --out-dir "$V07_REPOD_ROOT/reference"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Kotlin vs Python full tail-window parity
        run: gradle :app:testDebugUnitTest --tests 'de.meegread.app.analysis.CouplingFieldV07RepodClinicalParityTest' --no-daemon --stacktrace

      - name: Upload subject reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v07-repod-${{ matrix.subject }}-clinical
          path: |
            ${{ env.V07_REPOD_ROOT }}/reference/
            ${{ env.V07_REPOD_SOURCE_METADATA }}
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  aggregate:
    needs: subject-analysis
    runs-on: ubuntu-latest
    if: always() && needs.subject-analysis.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify frozen group script identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/validation/V07_REPOD_SCHIZOPHRENIA_CLINICAL_PREREG.json)" = "83a5c6e6e232687c7b37a2c7324711f1d946807c"
          test "$(git hash-object tools/validation/v07_repod_group.py)" = "2aa57a940b203dd6dc0eaeb2cd1ec1bd4dd6743a"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install frozen group-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3

      - name: Download all subject artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: v07-repod-*-clinical
          path: build/v07-repod/subjects
          merge-multiple: false

      - name: Aggregate preregistered clinical group inference
        run: |
          python tools/validation/v07_repod_group.py \
            --input-root build/v07-repod/subjects \
            --out-dir build/v07-repod/group

      - name: Upload frozen group result
        uses: actions/upload-artifact@v4
        with:
          name: v07-repod-schizophrenia-clinical-group
          path: build/v07-repod/group/
