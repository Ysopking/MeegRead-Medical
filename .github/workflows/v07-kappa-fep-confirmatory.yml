name: v0.7 Kappa FEP-Control Confirmatory Replication

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-cohort:
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.cohort.outputs.subjects }}
    steps:
      - name: Checkout app validation branch
        uses: actions/checkout@v5

      - name: Verify preregistration identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG.json)" = "7ccd126b57109d3986df777fb74c74e9f3a9a9ce"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_1.json)" = "8f2d7da904432df4e62a4443a1d5c8a6f448e1af"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_2.json)" = "0d5484e03672fe17d4f7967005270c78b82ffb4a"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_3.json)" = "7a12a6e455f923262839f31501588a046caff404"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_4.json)" = "950b22708476ec8d90b87428a23024bed4eb1576"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_5.json)" = "efa813999d0437c4ffc35004ab57a628d78e7404"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_6.json)" = "32c2e5fded12b9dd7064bacc4663e836c0adaf75"

      - name: Checkout frozen NEMAR metadata
        shell: bash
        run: |
          set -euo pipefail
          META="$RUNNER_TEMP/on003944-meta"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/nemarDatasets/on003944.git "$META"
          git -C "$META" checkout --quiet --detach 0831487239218bc9daef1cc43d91d07b0c7d153d
          test "$(git -C "$META" hash-object participants.tsv)" = "f83c8861f7f4ab397e08ed86a6fff4e9c79f28b3"
          echo "NEMAR_META=$META" >> "$GITHUB_ENV"

      - name: Freeze cohort from preregistered rule
        id: cohort
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os
          path = os.path.join(os.environ['NEMAR_META'], 'participants.tsv')
          rows=[]
          with open(path, encoding='utf-8', newline='') as f:
              for row in csv.DictReader(f, delimiter='\t'):
                  if not row['participant_id'].endswith('A') and row['type'] in {'Control','Psychosis'}:
                      rows.append(row)
          assert len(rows) == 72, len(rows)
          assert sum(r['type']=='Control' for r in rows) == 28
          assert sum(r['type']=='Psychosis' for r in rows) == 44
          print('subjects=' + json.dumps([r['participant_id'] for r in rows], separators=(',',':')))
          PY

  subject-confirmation:
    needs: prepare-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        subject: ${{ fromJSON(needs.prepare-cohort.outputs.subjects) }}
    env:
      ENGINE_BLOB_SHA1: be472fb4939d723dc4133f3652a8deabee470a04
      SIGNAL_ENGINE_BLOB_SHA1: e6f25721ad18be07666bf38de4921de6ee914a21
      PYTHON_ORACLE_BLOB_SHA1: 2cd26cf925a8d85970fb9dabaeb3a3c8d4409679
      PREREG_BLOB_SHA1: 7ccd126b57109d3986df777fb74c74e9f3a9a9ce
      ERRATUM_BLOB_SHA1: 8f2d7da904432df4e62a4443a1d5c8a6f448e1af
      ERRATUM_2_BLOB_SHA1: 0d5484e03672fe17d4f7967005270c78b82ffb4a
      ERRATUM_3_BLOB_SHA1: 7a12a6e455f923262839f31501588a046caff404
      ERRATUM_4_BLOB_SHA1: 950b22708476ec8d90b87428a23024bed4eb1576
      ERRATUM_5_BLOB_SHA1: efa813999d0437c4ffc35004ab57a628d78e7404
      ERRATUM_6_BLOB_SHA1: 32c2e5fded12b9dd7064bacc4663e836c0adaf75
      CHANNELS_TSV_BLOB_SHA1: 2d82b42319011eb1358e1413eab348307271e6f5
      DOWNLOAD_BLOB_SHA1: 38be2738cb36adcea4a10fc43ad5d2cc69897c44
      SUBJECT_SCRIPT_BLOB_SHA1: 802648be117b7b11781640823c15ea71db3143e0
      GROUP_SCRIPT_BLOB_SHA1: d0511884511eb8ae3fbf3a30859a17f266c1a732
      PARITY_TEST_BLOB_SHA1: 8b9a2bddd5ba5e146e3e3b775d18c45e4d08d376
      NEMAR_COMMIT: 0831487239218bc9daef1cc43d91d07b0c7d153d
      PARTICIPANTS_BLOB_SHA1: f83c8861f7f4ab397e08ed86a6fff4e9c79f28b3
      V07_DS003944_CONFIRMATORY: 'true'
      V07_DS003944_SUBJECT: ${{ matrix.subject }}
      V07_DS003944_ROOT: ${{ github.workspace }}/build/v07-ds003944/${{ matrix.subject }}
      V07_DS003944_REFERENCE_DIR: ${{ github.workspace }}/build/v07-ds003944/${{ matrix.subject }}/reference

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify frozen analysis identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG.json)" = "$PREREG_BLOB_SHA1"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_1.json)" = "$ERRATUM_BLOB_SHA1"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_2.json)" = "$ERRATUM_2_BLOB_SHA1"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_3.json)" = "$ERRATUM_3_BLOB_SHA1"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_4.json)" = "$ERRATUM_4_BLOB_SHA1"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_5.json)" = "$ERRATUM_5_BLOB_SHA1"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_6.json)" = "$ERRATUM_6_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_ds003944_download.py)" = "$DOWNLOAD_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_ds003944_kappa.py)" = "$SUBJECT_SCRIPT_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_ds003944_group.py)" = "$GROUP_SCRIPT_BLOB_SHA1"
          test "$(git hash-object app/src/test/java/de/meegread/app/analysis/CouplingFieldV07Ds003944KappaParityTest.kt)" = "$PARITY_TEST_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/analysis/CouplingFieldV07Engine.kt)" = "$ENGINE_BLOB_SHA1"
          test "$(git hash-object app/src/main/java/de/meegread/app/analysis/SignalAnalysisEngine.kt)" = "$SIGNAL_ENGINE_BLOB_SHA1"
          test "$(git hash-object tools/validation/v07_reference.py)" = "$PYTHON_ORACLE_BLOB_SHA1"

      - name: Checkout frozen NEMAR metadata
        shell: bash
        run: |
          set -euo pipefail
          META="$RUNNER_TEMP/on003944-meta"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/nemarDatasets/on003944.git "$META"
          git -C "$META" checkout --quiet --detach "$NEMAR_COMMIT"
          test "$(git -C "$META" hash-object participants.tsv)" = "$PARTICIPANTS_BLOB_SHA1"
          test "$(git -C "$META" hash-object "$V07_DS003944_SUBJECT/eeg/${V07_DS003944_SUBJECT}_task-Rest_channels.tsv")" = "$CHANNELS_TSV_BLOB_SHA1"
          echo "NEMAR_META=$META" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install frozen source-decoding dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 mne==1.10.1

      - name: Download exact frozen BrainVision source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$V07_DS003944_ROOT/source" "$V07_DS003944_REFERENCE_DIR"
          python tools/validation/v07_ds003944_download.py \
            --metadata-root "$NEMAR_META" \
            --subject "$V07_DS003944_SUBJECT" \
            --out-dir "$V07_DS003944_ROOT/source"

      - name: Generate frozen 12-window kappa confirmation
        shell: bash
        run: |
          set -euo pipefail
          GROUP="$(python - <<'PY'
          import json, os
          p=os.path.join(os.environ['V07_DS003944_ROOT'],'source','source_metadata.json')
          x=json.load(open(p,encoding='utf-8'))['group']
          print('control' if x=='Control' else 'psychosis')
          PY
          )"
          PYTHONPATH=tools/validation python tools/validation/v07_ds003944_kappa.py \
            --vhdr "$V07_DS003944_ROOT/source/${V07_DS003944_SUBJECT}_task-Rest_eeg.vhdr" \
            --channels-tsv "$NEMAR_META/${V07_DS003944_SUBJECT}/eeg/${V07_DS003944_SUBJECT}_task-Rest_channels.tsv" \
            --subject "$V07_DS003944_SUBJECT" \
            --group "$GROUP" \
            --source-metadata "$V07_DS003944_ROOT/source/source_metadata.json" \
            --out-dir "$V07_DS003944_REFERENCE_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Kotlin vs Python full parity on frozen subject window
        run: gradle :app:testDebugUnitTest --tests 'de.meegread.app.analysis.CouplingFieldV07Ds003944KappaParityTest' --no-daemon --stacktrace

      - name: Upload subject reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v07-ds003944-${{ matrix.subject }}-kappa
          path: |
            ${{ env.V07_DS003944_REFERENCE_DIR }}/
            ${{ env.V07_DS003944_ROOT }}/source/source_metadata.json
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  aggregate-confirmatory:
    needs: subject-confirmation
    runs-on: ubuntu-latest
    if: always() && needs.subject-confirmation.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify frozen inference identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG.json)" = "7ccd126b57109d3986df777fb74c74e9f3a9a9ce"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_1.json)" = "8f2d7da904432df4e62a4443a1d5c8a6f448e1af"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_2.json)" = "0d5484e03672fe17d4f7967005270c78b82ffb4a"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_3.json)" = "7a12a6e455f923262839f31501588a046caff404"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_4.json)" = "950b22708476ec8d90b87428a23024bed4eb1576"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_5.json)" = "efa813999d0437c4ffc35004ab57a628d78e7404"
          test "$(git hash-object docs/validation/V07_KAPPA_FEP_CONFIRMATORY_PREREG_ERRATUM_6.json)" = "32c2e5fded12b9dd7064bacc4663e836c0adaf75"
          test "$(git hash-object tools/validation/v07_ds003944_group.py)" = "d0511884511eb8ae3fbf3a30859a17f266c1a732"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install frozen inference dependency
        run: python -m pip install --disable-pip-version-check scipy==1.15.3

      - name: Download all frozen subject artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: v07-ds003944-*-kappa
          path: build/v07-ds003944/subjects
          merge-multiple: false

      - name: Run preregistered one-sided kappa group test
        run: |
          python tools/validation/v07_ds003944_group.py \
            --input-root build/v07-ds003944/subjects \
            --out-dir build/v07-ds003944/group

      - name: Upload confirmatory group result
        uses: actions/upload-artifact@v4
        with:
          name: v07-ds003944-kappa-confirmatory-group
          path: build/v07-ds003944/group/
