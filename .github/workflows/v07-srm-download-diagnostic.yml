name: v0.7 SRM Download Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compare direct S3 with official OpenNeuro client
        shell: bash
        run: |
          set -euo pipefail
          rel='sub-001/ses-t1/eeg/sub-001_ses-t1_task-resteyesc_eeg.edf'
          url="https://s3.amazonaws.com/openneuro.org/ds003775/$rel"
          curl --fail --location --retry 3 "$url" -o /tmp/s3.edf
          echo "S3 bytes=$(stat -c%s /tmp/s3.edf)"
          echo "S3 md5=$(md5sum /tmp/s3.edf | awk '{print $1}')"
          echo "S3 sha256=$(sha256sum /tmp/s3.edf | awk '{print $1}')"
          python -m pip install --disable-pip-version-check openneuro-py==2026.7.1
          mkdir -p /tmp/on
          openneuro-py download --dataset=ds003775 --target-dir=/tmp/on --include="$rel"
          test -f "/tmp/on/$rel"
          echo "CLIENT bytes=$(stat -c%s "/tmp/on/$rel")"
          echo "CLIENT md5=$(md5sum "/tmp/on/$rel" | awk '{print $1}')"
          echo "CLIENT sha256=$(sha256sum "/tmp/on/$rel" | awk '{print $1}')"
